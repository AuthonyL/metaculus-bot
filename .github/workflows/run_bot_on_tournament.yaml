name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *" # every 20 min, offset off the hour. Make sure to skip already-forecasted questions!
    # GitHub only honours this roughly every ~2 h in practice while questions are open for 3 h, so an
    # external cron (cron-job.org -> workflow_dispatch every 20 min) is the primary trigger; see README_CN.md 4b.

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      # Adding the below will make the workflow faster, but will mean you don't automatically get updates from forecasting-tools and other packages
      # - name: Load cached venv
      #   id: cached-poetry-dependencies
      #   uses: actions/cache@v4
      #   with:
      #     path: .venv
      #     key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      # state/attempts.json remembers which questions were already tried (attempt_guard.py), so a
      # question that keeps failing is not re-researched every 15 minutes. restore-keys picks the
      # newest cache with that prefix; a fresh key per run is how actions/cache does "update".
      - name: Restore attempt memory
        uses: actions/cache/restore@v4
        with:
          path: state
          key: attempts-${{ github.run_id }}
          restore-keys: attempts-
      - name: Run bot
        run: |
          poetry run python main.py
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          OPENROUTER_SPEND_CAP_USD: ${{ vars.OPENROUTER_SPEND_CAP_USD || '45' }} # budget_guard.py hard stop (Settings → Variables)
          PREDICTIONS_PER_QUESTION: ${{ vars.PREDICTIONS_PER_QUESTION || '3' }}
          FORECAST_MINIBENCH: ${{ vars.FORECAST_MINIBENCH || '1' }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
      - name: Save attempt memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: attempts-${{ github.run_id }}